name: Build

on:
  push:
    branches: [main, "feat/**", "test/**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Build
        run: |
          set -o pipefail
          ./gradlew clean build --stacktrace --no-daemon 2>&1 | tee "$RUNNER_TEMP/re-demo-ci-build.log"
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: re-demo-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.sha }}
          path: ${{ runner.temp }}/re-demo-ci-build.log
          if-no-files-found: error
