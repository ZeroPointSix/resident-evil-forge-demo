name: QA Validator Self Tests

on:
  push:
    paths:
      - tools/qa/**
      - tests/test_validate_assets.py
      - .github/workflows/qa-validator-tests.yml
  pull_request:
    paths:
      - tools/qa/**
      - tests/test_validate_assets.py
      - .github/workflows/qa-validator-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validator-regression:
    name: Static validator regression tests (not game E2E)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run isolated synthetic-fixture regression tests
        run: python3 -m unittest discover -s tests -p test_validate_assets.py -v
