name: Blender 4 Original Blockout Preview

on:
  push:
    branches: [art/remodel-blender4-20261004]
    paths:
      - art/previews/20261004/*.py
      - .github/workflows/remodel-preview.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blender-blockout-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    if: github.ref == 'refs/heads/art/remodel-blender4-20261004'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender 4.2.20 LTS and image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libxi6 libxrender1 libxxf86vm1 libxfixes3 libxkbcommon0 libsm6 libgl1 fonts-noto-cjk python3-pil
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 2 -O https://download.blender.org/release/Blender4.2/blender-4.2.20-linux-x64.tar.xz
          curl --fail --location --retry 2 -O https://download.blender.org/release/Blender4.2/blender-4.2.20.sha256
          grep 'blender-4.2.20-linux-x64.tar.xz' blender-4.2.20.sha256 | sha256sum --check -
          tar -tf blender-4.2.20-linux-x64.tar.xz | head -n 5 || true
          tar -xf blender-4.2.20-linux-x64.tar.xz
          echo "$RUNNER_TEMP/blender-4.2.20-linux-x64" >> "$GITHUB_PATH"
      - name: Build and render actual mesh assets
        run: |
          set -o pipefail
          blender --version
          blender -b --python-exit-code 1 --python art/previews/20261004/build_blockouts.py -- --output art/previews/20261004/deliverables 2>&1 | tee "$RUNNER_TEMP/blockouts.log"
          python3 art/previews/20261004/compose_review.py art/previews/20261004/deliverables
          python3 art/previews/20261004/validate_preview.py art/previews/20261004/deliverables
      - name: Commit only preview assets to the independent branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add art/previews/20261004/deliverables
          if ! git diff --cached --quiet; then
            git commit -m 'art: render original Blender 4 creature blockout previews'
            git push origin HEAD:art/remodel-blender4-20261004
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blender-blockout-preview
          path: |
            art/previews/20261004/deliverables/
            ${{ runner.temp }}/blockouts.log
          if-no-files-found: error
